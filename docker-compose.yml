version: '3.8'

services:
  inventario-db:
    image: postgres:15-alpine
    container_name: inventario_pg
    environment:
      POSTGRES_USER: admin_ti
      POSTGRES_PASSWORD: TuPasswordSeguro123
      POSTGRES_DB: inventariodb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  inventario-app:
    build: .
    container_name: inventario_web
    environment:
      - DATABASE_URL=postgresql://admin_ti:TuPasswordSeguro123@inventario-db:5432/inventariodb?schema=public
      - JWT_SECRET=tu_clave_secreta_super_segura
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - inventario-db
    restart: unless-stopped

volumes:
  pgdata:
